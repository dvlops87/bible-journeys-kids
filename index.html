<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Journeys: David &amp; Moses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Literata:ital,wght@0,400;0,500;1,400&family=Noto+Serif+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --night-950:#0b0e1a;
    --night-900:#12162a;
    --night-800:#1c2340;
    --night-700:#293158;
    --parchment:#e9dfc4;
    --parchment-dim:#a79f87;
    --bronze:#caa257;
    --bronze-bright:#f0c877;
    --clay:#9a6a48;
    --line: rgba(202,162,87,.22);
    --shadow: rgba(0,0,0,.5);
    --violet:#8d76c4;
    --violet-line: rgba(141,118,196,.35);
    --teal:#5aa9a3;
    --teal-line: rgba(90,169,163,.35);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--night-950);
    color: var(--parchment);
    font-family:'Literata', Georgia, 'Times New Roman', serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  html[lang="ko"] body{ font-family:'Noto Serif KR', 'Literata', Georgia, serif; }
  h1,h2,h3,.display{
    font-family:'Fraunces', Georgia, serif;
    text-wrap:balance;
    letter-spacing:.01em;
  }
  html[lang="ko"] h1, html[lang="ko"] h2, html[lang="ko"] h3, html[lang="ko"] .display{
    font-family:'Noto Serif KR', 'Fraunces', Georgia, serif;
  }
  .mono{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-variant-numeric:tabular-nums;
  }
  a{color:var(--bronze-bright);}

  /* ---- starfield backdrop ---- */
  #sky{
    position:fixed; inset:0; z-index:-2;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, var(--night-700) 0%, transparent 60%),
      linear-gradient(180deg, var(--night-950) 0%, var(--night-900) 55%, var(--night-800) 100%);
  }
  #stars{position:fixed; inset:0; z-index:-1; pointer-events:none;}
  #horizon-glow{
    position:fixed; left:0; right:0; bottom:0; height:38vh; z-index:-1; pointer-events:none;
    background: radial-gradient(ellipse 60% 100% at 50% 100%, rgba(202,162,87,.10), transparent 70%);
  }

  /* ---- shell ---- */
  #app{
    max-width:760px; margin:0 auto;
    min-height:100vh;
    display:flex; flex-direction:column;
    padding: 0 22px;
  }

  header{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px;
    padding:16px 0 12px;
    background:linear-gradient(180deg, var(--night-950) 70%, transparent);
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-size:13px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--parchment-dim);
  }
  html[lang="ko"] .brand{ letter-spacing:.04em; text-transform:none; }
  .brand svg{flex:none;}
  .header-right{display:flex; align-items:center; gap:14px;}
  #chapter-tag{font-size:12px; color:var(--bronze); letter-spacing:.08em;}
  #lang-toggle{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.06em;
    color:var(--bronze-bright); background:transparent; border:1px solid var(--line);
    border-radius:3px; padding:6px 10px; cursor:pointer; text-transform:uppercase;
    transition:border-color .15s ease, background .15s ease;
  }
  #lang-toggle:hover{border-color:var(--bronze); background:var(--night-800);}
  #lang-toggle:focus-visible{outline:2px solid var(--bronze-bright); outline-offset:2px;}
  #progress-track{
    position:relative; height:3px; border-radius:2px;
    background:var(--night-700); overflow:hidden; margin-top:10px;
  }
  #progress-fill{
    position:absolute; inset:0 auto 0 0; width:0%;
    background:linear-gradient(90deg, var(--clay), var(--bronze-bright));
    transition:width .5s ease;
  }

  main{flex:1; display:flex; flex-direction:column; justify-content:center; padding:28px 0 48px;}

  .scene{animation: rise .5s ease both;}
  @keyframes rise{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce){ .scene{animation:none;} }

  .icon-row{display:flex; align-items:center; gap:14px; margin-bottom:6px;}
  .eyebrow{
    font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--bronze); margin:0;
  }
  html[lang="ko"] .eyebrow{ letter-spacing:.02em; text-transform:none; font-size:13px; }
  .scene h2{
    font-size:clamp(28px,4.6vw,42px); font-weight:600; margin:6px 0 18px; color:var(--parchment);
  }
  .scene p{
    font-size:17px; line-height:1.65; max-width:64ch; color:var(--parchment);
    margin:0 0 14px;
  }
  html[lang="ko"] .scene p{ font-size:16.5px; line-height:1.85; word-break:keep-all; }
  .verse{
    font-style:italic; color:var(--parchment-dim); border-left:2px solid var(--line);
    padding-left:14px; margin:20px 0; font-size:15.5px; line-height:1.6;
  }
  html[lang="ko"] .verse{ font-style:normal; line-height:1.8; word-break:keep-all; }

  .choices{display:flex; flex-direction:column; gap:10px; margin-top:26px;}
  .choice-btn{
    text-align:left; font-family:'Literata',serif; font-size:15.5px;
    color:var(--parchment); background:var(--night-900);
    border:1px solid var(--line); border-radius:4px;
    padding:14px 16px; cursor:pointer; line-height:1.4;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  html[lang="ko"] .choice-btn{ font-family:'Noto Serif KR','Literata',serif; word-break:keep-all; line-height:1.6; }
  .choice-btn:hover{border-color:var(--bronze); background:var(--night-800);}
  .choice-btn:active{transform:scale(.995);}
  .choice-btn:focus-visible{outline:2px solid var(--bronze-bright); outline-offset:2px;}
  .choice-btn .k{color:var(--bronze); font-family:'IBM Plex Mono',monospace; font-size:12px; margin-right:8px;}
  .choice-btn.risk{border-color:var(--violet-line);}
  .choice-btn.risk:hover{border-color:var(--violet); background:var(--night-800);}
  .choice-btn.risk .k{color:var(--violet);}
  .choice-btn.picked{border-color:var(--bronze-bright); background:var(--night-800); box-shadow:inset 0 0 0 1px var(--bronze-bright);}
  .choice-btn.risk.picked{border-color:var(--violet); box-shadow:inset 0 0 0 1px var(--violet);}

  /* ---- parallel-timeline branch ---- */
  .parallel-scene{ border-left:2px solid var(--violet-line); padding-left:20px; margin-left:-2px; }
  .parallel-scene .eyebrow{color:var(--violet);}

  .cta-row{display:flex; gap:12px; margin-top:28px; flex-wrap:wrap;}
  [hidden]{display:none !important;}
  .btn{
    font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:.06em; text-transform:uppercase;
    padding:13px 22px; border-radius:3px; cursor:pointer; border:1px solid var(--bronze);
    background:transparent; color:var(--bronze-bright);
    transition:background .15s ease, color .15s ease, opacity .15s ease;
  }
  html[lang="ko"] .btn{ letter-spacing:.02em; text-transform:none; font-family:'Noto Serif KR','IBM Plex Mono',monospace; }
  .btn:hover{background:var(--bronze); color:var(--night-950);}
  .btn.primary{background:var(--bronze); color:var(--night-950);}
  .btn.primary:hover{background:var(--bronze-bright); border-color:var(--bronze-bright);}
  .btn:focus-visible{outline:2px solid var(--bronze-bright); outline-offset:2px;}
  .btn:disabled{opacity:.32; cursor:not-allowed; pointer-events:none;}
  .btn.secondary{border-color:var(--line); color:var(--parchment-dim);}
  .btn.secondary:hover{background:var(--night-800); color:var(--parchment); border-color:var(--parchment-dim);}

  .reveal-msg{ min-height:22px; margin-top:16px; font-size:15px; color:var(--parchment); font-style:italic; }
  html[lang="ko"] .reveal-msg{ font-style:normal; word-break:keep-all; }

  /* ---- title screen ---- */
  .title-screen{text-align:left;}
  .title-screen .display{
    font-size:clamp(40px,9vw,84px); font-weight:800; line-height:.98; margin:10px 0 4px;
  }
  .title-sub{color:var(--parchment-dim); font-size:16px; max-width:52ch; margin:0 0 8px;}
  html[lang="ko"] .title-sub{ word-break:keep-all; line-height:1.75; }
  .record{ margin-top:22px; font-size:13px; color:var(--bronze); font-family:'IBM Plex Mono',monospace; }
  html[lang="ko"] .record{ font-family:'Noto Serif KR','IBM Plex Mono',monospace; }

  /* ---- character select ---- */
  .select-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:28px; }
  @media (max-width:600px){ .select-grid{ grid-template-columns:1fr; } }
  .select-card{
    text-align:left; width:100%; font-family:'Literata',serif;
    background:var(--night-900); border:1px solid var(--line); border-radius:6px;
    padding:20px; cursor:pointer; transition:border-color .15s ease, background .15s ease;
  }
  html[lang="ko"] .select-card{ font-family:'Noto Serif KR','Literata',serif; }
  .select-card:hover{ border-color:var(--bronze); background:var(--night-800); }
  .select-card.picked{ border-color:var(--bronze-bright); box-shadow:inset 0 0 0 1px var(--bronze-bright); }
  .select-card:focus-visible{ outline:2px solid var(--bronze-bright); outline-offset:2px; }
  .select-card h3{ font-family:'Fraunces',Georgia,serif; font-size:26px; margin:0 0 8px; color:var(--parchment); }
  html[lang="ko"] .select-card h3{ font-family:'Noto Serif KR','Fraunces',serif; }
  .select-card p{ font-size:14.5px; line-height:1.55; color:var(--parchment-dim); margin:0; word-break:keep-all; }

  /* ---- minigame (duel / red sea) ---- */
  .game-wrap{position:relative; margin-top:10px;}
  .game-canvas-el{
    width:100%; height:340px; display:block; border-radius:4px;
    border:1px solid var(--line); touch-action:none; cursor:crosshair;
    background:var(--night-900);
  }
  .game-canvas-el:focus-visible{outline:2px solid var(--bronze-bright); outline-offset:3px;}
  .game-hud{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:12px;
    color:var(--parchment-dim); letter-spacing:.04em;
  }
  html[lang="ko"] .game-hud{ font-family:'Noto Serif KR','IBM Plex Mono',monospace; }
  .stones{display:flex; gap:6px;}
  .stone-dot{width:9px; height:9px; border-radius:50%; background:var(--night-700); border:1px solid var(--line);}
  .stone-dot.used{background:transparent; border-color:var(--parchment-dim); opacity:.35;}
  .stone-dot.active{background:var(--bronze-bright); border-color:var(--bronze-bright);}
  .meter-track{ width:140px; height:8px; border-radius:4px; background:var(--night-700); overflow:hidden; border:1px solid var(--line); }
  .meter-fill{ height:100%; background:linear-gradient(90deg, var(--teal), var(--bronze-bright)); width:0%; }

  /* ---- journey summary ---- */
  .journey{list-style:none; margin:18px 0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .journey li{
    display:flex; gap:10px; font-size:14.5px; color:var(--parchment-dim);
    border-bottom:1px dashed var(--line); padding-bottom:8px;
  }
  html[lang="ko"] .journey li{ word-break:keep-all; }
  .journey li span.tag{
    flex:none; width:96px; color:var(--bronze); font-family:'IBM Plex Mono',monospace; font-size:11px;
    letter-spacing:.06em; text-transform:uppercase; padding-top:2px;
  }
  html[lang="ko"] .journey li span.tag{ width:88px; text-transform:none; font-family:'Noto Serif KR','IBM Plex Mono',monospace; }

  footer{
    text-align:left; padding:18px 0 30px; color:var(--parchment-dim); font-size:12px;
    border-top:1px solid var(--line);
  }
</style>

<div id="sky"></div>
<canvas id="stars"></canvas>
<div id="horizon-glow"></div>

    <div class="brand">

  <main id="stage"></main>

  <footer id="site-footer">Two callings from Scripture, chosen by you</footer>
</div>

  function t(){ return STR[LANG]; }

  var PREFERS_REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ---------- starfield ---------- */
  var starCanvas = document.getElementById('stars');
  var sctx = starCanvas.getContext('2d');
  var stars = [];
  function seedStars(){
    starCanvas.width = window.innerWidth;
    starCanvas.height = window.innerHeight;
    stars = [];
    var n = Math.floor((starCanvas.width * starCanvas.height) / 9000);
    for(var i=0;i<n;i++){
      stars.push({
        x: Math.random()*starCanvas.width,
        y: Math.random()*starCanvas.height*0.75,
        r: Math.random()*1.2 + 0.2,
        a: Math.random()*0.6 + 0.25,
        tw: Math.random()*0.02 + 0.005,
        ph: Math.random()*Math.PI*2
      });
    }
  }
  function drawStars(tm){
    sctx.clearRect(0,0,starCanvas.width, starCanvas.height);
    for(var i=0;i<stars.length;i++){
      var s = stars[i];
      var a = PREFERS_REDUCED_MOTION ? s.a : s.a + Math.sin(tm*s.tw + s.ph)*0.2;
      sctx.fillStyle = 'rgba(233,223,196,' + Math.max(0,a).toFixed(3) + ')';
      sctx.beginPath();
      sctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      sctx.fill();
    }
    if(!PREFERS_REDUCED_MOTION){ requestAnimationFrame(drawStars); }
  }
  seedStars();
  window.addEventListener('resize', function(){
    seedStars();
    if(PREFERS_REDUCED_MOTION){ drawStars(0); }
  });
  drawStars(0);

    document.documentElement.setAttribute('lang', LANG);

    } else if(mode === 'david'){

      chapterTag.textContent = t().mChapterTags[sceneIndex];
      progressFill.style.width = Math.round((sceneIndex/(scenes.length-1))*100) + '%';
    }
  }

          {k:'A', field:'choiceA', journeyField:'journeyA'},
          {k:'B', field:'choiceB', journeyField:'journeyB'},
          {k:'C', field:'choiceRisky', risky:true}
        ] } },
    { key:'mPassover', cfg:{ icon:'door', selfIndex:4, next:5,
        content:[{p:'p1'},{verse:'verse',ref:'verseRef'},{p:'p2'}],
        choices:[
          {k:'A', field:'choiceA', journeyField:'journeyA'},
          {k:'B', field:'choiceB', journeyField:'journeyB'},
          {k:'C', field:'choiceRisky', risky:true}
        ] } },
    { key:'mRedsea' },
    { key:'mEnd' }
  ];

  function go(i){
    cleanupGame();
    sceneIndex = i;
    applyChrome();
    render(scenes[i].key);
    window.scrollTo({top:0, behavior:'instant'});
  }

  function enterCharacter(which){
    mode = which;
    scenes = (which === 'david') ? scenesDavid : scenesMoses;
    journey = [];
    go(0);
  }

  function backToSelect(){
    cleanupGame();
    mode = 'select';
    scenes = [];
    pickedCharacter = null;
    applyChrome();
    render('select');
    window.scrollTo({top:0, behavior:'instant'});
  }

  /* Stores a scene key + a resolver run against that scene's *current-language*
     strings at render time, so a mid-game language toggle never leaves the
     journey summary mixing English and Korean lines. */
  function choiceRecord(sceneKey, resolver){
    journey.push({sceneKey:sceneKey, resolver:resolver});
  }

  /* Shows a short, clearly-marked "what if" detour when the player takes the
     risky option in a decision scene, then lets them step back into the fork
     and choose again — a dead branch, not a dead end. */
  function showParallel(branchKey, backIndex){
    cleanupGame();
    stage.innerHTML = '';
    var el = document.createElement('div');
    el.className = 'scene parallel-scene';
    stage.appendChild(el);
    var b = t().parallel[branchKey];
    el.innerHTML =
      '<div class="icon-row">'+icon('star')+'<p class="eyebrow">'+t().parallelLabel+'</p></div>' +
      '<h2>'+b.h2+'</h2>' +
      '<p>'+b.p1+'</p>' +
      '<div class="cta-row"><button class="btn" id="return-btn">'+t().parallelReturn+'</button></div>';
    el.querySelector('#return-btn').addEventListener('click', function(){ go(backIndex); });
    window.scrollTo({top:0, behavior:'instant'});
  }

  /* ---------- renderers ---------- */
  function render(key){
    stage.innerHTML = '';
    var el = document.createElement('div');
    el.className = 'scene';
    stage.appendChild(el);

    if(key === 'select') return renderSelect(el);
    if(key === 'title') return renderCharTitle(el, 'title', BEST_KEY_DAVID, function(best){ return t().title.recordPrefix + best + t().title.recordSuffix; });
    if(key === 'mTitle') return renderCharTitle(el, 'mTitle', BEST_KEY_MOSES, function(best){ return t().mTitle.recordPrefix + best + t().mTitle.recordSuffix; });
    if(key === 'duel') return renderDuel(el);
    if(key === 'mRedsea') return renderRedSea(el);
    if(key === 'end') return renderEnd(el, 'end');
    if(key === 'mEnd') return renderEnd(el, 'mEnd');
    var def = scenes[sceneIndex];
    if(def && def.cfg) return renderStoryScene(el, key, def.cfg);
  }

  function renderSelect(el){
    var s = t().select;
    el.innerHTML =
      '<div class="title-screen">' +
        '<p class="eyebrow">'+s.eyebrow+'</p>' +
        '<h1 class="display">'+s.h1+'</h1>' +
        '<p class="title-sub">'+s.sub+'</p>' +
        '<div class="select-grid">' +
          '<button class="select-card" id="pick-david" type="button"><h3>'+s.davidTitle+'</h3><p>'+s.davidBlurb+'</p></button>' +
          '<button class="select-card" id="pick-moses" type="button"><h3>'+s.mosesTitle+'</h3><p>'+s.mosesBlurb+'</p></button>' +
        '</div>' +
        '<div class="cta-row"><button class="btn primary" id="select-next" disabled>'+s.start+'</button></div>' +
      '</div>';
    var cardDavid = el.querySelector('#pick-david');
    var cardMoses = el.querySelector('#pick-moses');
    var nextBtn = el.querySelector('#select-next');
    function pick(which){
      pickedCharacter = which;
      cardDavid.classList.toggle('picked', which==='david');
      cardMoses.classList.toggle('picked', which==='moses');
      nextBtn.disabled = false;
    }
    cardDavid.addEventListener('click', function(){ pick('david'); });
    cardMoses.addEventListener('click', function(){ pick('moses'); });
    nextBtn.addEventListener('click', function(){
      if(pickedCharacter) enterCharacter(pickedCharacter);
    });
  }

  function renderCharTitle(el, key, bestStoreKey, recordText){
    var s = t()[key];
    var best = localStorage.getItem(bestStoreKey);
    el.innerHTML =
      '<div class="title-screen">' +
        '<p class="eyebrow">'+s.eyebrow+'</p>' +
        '<h1 class="display">'+s.display+'</h1>' +
        '<p class="title-sub">'+s.sub+'</p>' +
        (best!==null ? '<p class="record">'+recordText(best)+'</p>' : '') +
        '<div class="cta-row">' +
          '<button class="btn primary" id="start-btn">'+s.start+'</button>' +
          '<button class="btn secondary" id="back-btn">&larr; '+t().chooseOtherLabel+'</button>' +
        '</div>' +
      '</div>';
    el.querySelector('#start-btn').addEventListener('click', function(){ go(1); });
    el.querySelector('#back-btn').addEventListener('click', backToSelect);
  }

  /* Generic renderer for every "read, optionally pick one option, confirm
     with Next" scene in either character's track. Clicking a choice only
     marks it picked; nothing is recorded or navigated until Next is
     pressed, so a mis-click never skips text the player hasn't read. */
  function renderStoryScene(el, sceneKey, cfg){
    var s = t()[sceneKey];
    var html = '<div class="icon-row">'+icon(cfg.icon)+'<p class="eyebrow">'+s.eyebrow+'</p></div>' +
                '<h2>'+s.h2+'</h2>';
    cfg.content.forEach(function(part){
      if(part.p) html += '<p>'+s[part.p]+'</p>';
      if(part.verse) html += '<p class="verse">'+s[part.verse]+'<br>'+s[part.ref]+'</p>';
    });
    var hasChoices = cfg.choices && cfg.choices.length;
    if(hasChoices){
      html += '<div class="choices">' + cfg.choices.map(function(c,i){
        var cls = 'choice-btn' + (c.risky ? ' risk' : '');
        return '<button class="'+cls+'" data-idx="'+i+'" type="button"><span class="k">'+c.k+'</span>'+s[c.field]+'</button>';
      }).join('') + '</div>';
      html += '<p class="reveal-msg" id="reveal-msg"></p>';
    }
    html += '<div class="cta-row"><button class="btn primary" id="next-btn"'+(hasChoices?' disabled':'')+'>'+t().nextLabel+'</button></div>';
    el.innerHTML = html;

    var selected = hasChoices ? null : 0;
    var nextBtn = el.querySelector('#next-btn');
    var revealEl = el.querySelector('#reveal-msg');
    var btns = null;
    if(hasChoices){
      btns = el.querySelectorAll('.choice-btn');
      btns.forEach(function(b, i){
        b.addEventListener('click', function(){
          selected = i;
          for(var j=0;j<btns.length;j++) btns[j].classList.remove('picked');
          b.classList.add('picked');
          nextBtn.disabled = false;
          var c = cfg.choices[i];
          revealEl.textContent = c.revealField ? s[c.revealField] : '';
        });
      });
    }
    nextBtn.addEventListener('click', function(){
      if(hasChoices){
        var c = cfg.choices[selected];
        if(c.risky){ showParallel(cfg.branchKey || sceneKey, cfg.selfIndex); return; }
        choiceRecord(sceneKey, c.journeyIsPrefixedLabel
          ? function(strs){ return strs.journeyPrefix + strs[c.field]; }
          : function(strs){ return strs[c.journeyField]; });
      } else if(cfg.fixedJourneyField){
        choiceRecord(sceneKey, (function(field){ return function(strs){ return strs[field]; }; })(cfg.fixedJourneyField));
      }
      go(cfg.next);
    });
  }

  /* ---------- duel minigame (David) ---------- */
  function renderDuel(el){
    var s = t().duel;
    el.innerHTML =
      '<div class="icon-row">'+icon('sling')+'<p class="eyebrow">'+s.eyebrow+'</p></div>' +
      '<h2>'+s.h2+'</h2>' +
      '<p>'+s.p1+'</p>' +
      '<div class="game-wrap">' +
        '<canvas id="duel-canvas" class="game-canvas-el" width="1000" height="340" tabindex="0" aria-label="'+s.ariaLabel+'"></canvas>' +
      '</div>' +
      '<div class="game-hud"><div class="stones" id="stone-pips"></div><div id="power-readout" class="mono">'+s.dragHint+'</div></div>' +
      '<p class="reveal-msg" id="duel-msg">'+s.initialMsg+'</p>' +
      '<div class="cta-row" id="duel-next-row" hidden><button class="btn primary" id="duel-next-btn">'+t().nextLabel+'</button></div>';

    el.querySelector('#duel-next-btn').addEventListener('click', function(){ go(6); });

    var canvas = el.querySelector('#duel-canvas');
    var ctx = canvas.getContext('2d');
    var pipsEl = el.querySelector('#stone-pips');
    var powerEl = el.querySelector('#power-readout');
    var msgEl = el.querySelector('#duel-msg');
    var nextRow = el.querySelector('#duel-next-row');

    var GRAVITY = 0.32, LAUNCH_MARGIN = 1.25;
    var CW, CH, launchK = 0.16;
    var pivot = {x:70, y:0};
    var restOffset = 30, bandAnchor = 14, maxD = 70;
    function computeLaunchK(){
      var D = (CW - 150) - pivot.x;
      var launchY = (CH - 40) - restOffset;
      var targetY = (CH - 46) - 138;
      var H = launchY - targetY;
      var bestSpeed2 = Infinity;
      for(var a=5; a<=85; a+=0.25){
        var rad = a*Math.PI/180, sn = Math.sin(rad), cs = Math.cos(rad);
        var denom = D*sn*cs - H*cs*cs;
        if(denom<=0) continue;
        var speed2 = 0.5*GRAVITY*D*D/denom;
        if(speed2 < bestSpeed2) bestSpeed2 = speed2;
      }
      return (Math.sqrt(bestSpeed2)*LAUNCH_MARGIN)/maxD;
    }
    function fitCanvas(){
      var rect = canvas.getBoundingClientRect();
      CW = canvas.width = rect.width * 2;
      CH = canvas.height = rect.height * 2;
      ctx.setTransform(2,0,0,2,0,0);
      CW = rect.width; CH = rect.height;
      launchK = computeLaunchK();
    }
    fitCanvas();

    gameResizeHandler = function(){ fitCanvas(); };
    window.addEventListener('resize', gameResizeHandler);

    var stonesTotal = 5, stonesUsed = 0, gameOver = false;
    var dragging = false, dragPt = null;
    var projectile = null;
    var goliathHitFlash = 0;
    var goliathTarget = null;
    var canvasFocused = false;
    var keyAim = { angle: 55, power: 55 };
    var t0 = performance.now();

    function updatePips(){
      pipsEl.innerHTML = '';
      for(var i=0;i<stonesTotal;i++){
        var d = document.createElement('div');
        d.className = 'stone-dot' + (i < stonesUsed ? ' used' : (i===stonesUsed ? ' active' : ''));
        pipsEl.appendChild(d);
      }
    }
    updatePips();

    function goliathPos(tm){
      var baseX = CW - 150;
      var sway = PREFERS_REDUCED_MOTION ? 0 : Math.sin(tm*0.0009) * 18;
      var groundY = CH - 46;
      return { x: baseX + sway, groundY: groundY };
    }

    function keyAimPoint(){
      var rad = keyAim.angle * Math.PI/180;
      var frac = keyAim.power/100;
      return { x: pivot.x - Math.cos(rad)*frac*maxD, y: (pivot.y-restOffset) + Math.sin(rad)*frac*maxD };
    }

    function drawBand(stoneX, stoneY, dashed){
      ctx.strokeStyle = 'rgba(233,223,196,.5)'; ctx.lineWidth = 1.5;
      if(dashed) ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(pivot.x-bandAnchor, pivot.y-restOffset); ctx.lineTo(stoneX,stoneY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pivot.x+bandAnchor, pivot.y-restOffset); ctx.lineTo(stoneX,stoneY); ctx.stroke();
      if(dashed) ctx.setLineDash([]);
    }

    function drawTrajectoryPreview(stoneX, stoneY){
      var pdx = pivot.x - stoneX, pdy = (pivot.y-restOffset) - stoneY;
      var px=stoneX, py=stoneY, ppvx=pdx*launchK, ppvy=pdy*launchK;
      ctx.fillStyle = 'rgba(202,162,87,.5)';
      for(var i=0;i<26;i++){
        px+=ppvx; py+=ppvy; ppvy+=GRAVITY;
        if(i%2===0) { ctx.beginPath(); ctx.arc(px,py,1.6,0,Math.PI*2); ctx.fill(); }
        if(py>CH) break;
      }
    }

    function drawScene(tm){
      ctx.clearRect(0,0,CW,CH);
      pivot.y = CH - 40;

      var g = ctx.createLinearGradient(0,0,0,CH);
      g.addColorStop(0,'#141a30'); g.addColorStop(1,'#1c2340');
      ctx.fillStyle = g; ctx.fillRect(0,0,CW,CH);

      ctx.fillStyle = '#0f1224';
      ctx.beginPath();
      ctx.moveTo(0,CH-70);
      ctx.quadraticCurveTo(CW*0.3, CH-120, CW*0.55, CH-72);
      ctx.quadraticCurveTo(CW*0.8, CH-40, CW, CH-64);
      ctx.lineTo(CW,CH); ctx.lineTo(0,CH); ctx.closePath(); ctx.fill();

      ctx.strokeStyle = 'rgba(202,162,87,.25)';
      ctx.beginPath(); ctx.moveTo(0,CH-40); ctx.lineTo(CW,CH-40); ctx.stroke();

      var gp = goliathPos(tm);
      var gx = gp.x, groundY = gp.groundY;
      var flashOn = goliathHitFlash > 0;
      ctx.fillStyle = flashOn ? '#e6c17a' : '#3a3f5c';
      ctx.fillRect(gx-16, groundY-120, 32, 90);
      ctx.beginPath(); ctx.arc(gx, groundY-134, 17, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = flashOn ? '#f0c877' : '#8a6a35';
      ctx.beginPath(); ctx.arc(gx, groundY-140, 14, Math.PI, 0); ctx.fill();
      ctx.fillStyle = 'rgba(233,223,196,.5)';
      ctx.beginPath(); ctx.arc(gx, groundY-138, 4.2, 0, Math.PI*2); ctx.fill();
      if(goliathHitFlash>0) goliathHitFlash -= 1;

      goliathTarget = {x:gx, y:groundY-138, forehead:4.2*1.6, body:{x:gx-18,y:groundY-120,w:36,h:92}};

      ctx.strokeStyle = '#caa257'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(pivot.x, pivot.y+8); ctx.lineTo(pivot.x, pivot.y-restOffset); ctx.stroke();

      var stoneX = pivot.x, stoneY = pivot.y - restOffset;
      if(dragging && dragPt){
        stoneX = pivot.x + (dragPt.x - pivot.x);
        stoneY = (pivot.y-restOffset) + (dragPt.y - (pivot.y-restOffset));
        var dx = stoneX-pivot.x, dy = stoneY-(pivot.y-restOffset);
        var dist = Math.sqrt(dx*dx+dy*dy);
        if(dist>maxD){ stoneX = pivot.x + dx/dist*maxD; stoneY = (pivot.y-restOffset)+dy/dist*maxD; }
        drawBand(stoneX, stoneY, true);
        drawTrajectoryPreview(stoneX, stoneY);
      } else if(!projectile && canvasFocused){
        var kp = keyAimPoint();
        stoneX = kp.x; stoneY = kp.y;
        drawBand(stoneX, stoneY, true);
        drawTrajectoryPreview(stoneX, stoneY);
      } else if(!projectile) {
        drawBand(stoneX, stoneY, false);
      }
      if(!projectile){
        ctx.fillStyle = '#caa257';
        ctx.beginPath(); ctx.arc(stoneX, stoneY, 6, 0, Math.PI*2); ctx.fill();
      }
      if(projectile){
        ctx.fillStyle = '#f0c877';
        ctx.beginPath(); ctx.arc(projectile.x, projectile.y, 5.5, 0, Math.PI*2); ctx.fill();
      }
    }

    function pointerToCanvas(e){
      var rect = canvas.getBoundingClientRect();
      var cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      var cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      return {x:cx, y:cy};
    }

    function fireStone(stoneX, stoneY){
      projectile = { x:stoneX, y:stoneY, vx:(pivot.x-stoneX)*launchK, vy:((pivot.y-restOffset)-stoneY)*launchK };
      stonesUsed += 1;
      updatePips();
      powerEl.textContent = s.stoneAway;
    }

    canvas.addEventListener('pointerdown', function(e){
      if(gameOver || projectile) return;
      dragging = true; dragPt = pointerToCanvas(e);
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', function(e){
      if(!dragging) return;
      dragPt = pointerToCanvas(e);
      var dx = dragPt.x-pivot.x, dy = dragPt.y-(pivot.y-restOffset);
      var dist = Math.min(maxD, Math.sqrt(dx*dx+dy*dy));
      powerEl.textContent = s.powerLabel + Math.round((dist/maxD)*100) + '%';
    });
    canvas.addEventListener('pointerup', function(e){
      if(!dragging) return;
      dragging = false;
      var dx = dragPt.x-pivot.x, dy = dragPt.y-(pivot.y-restOffset);
      var dist = Math.sqrt(dx*dx+dy*dy);
      if(dist < 8){ dragPt=null; powerEl.textContent=s.dragHint; return; }
      if(dist>maxD){ dx = dx/dist*maxD; dy = dy/dist*maxD; }
      var stoneX = pivot.x+dx, stoneY = (pivot.y-restOffset)+dy;
      dragPt = null;
      fireStone(stoneX, stoneY);
    });
    canvas.addEventListener('focus', function(){
      canvasFocused = true;
      if(!gameOver && !projectile) powerEl.textContent = s.powerLabel + keyAim.power + '%';
    });
    canvas.addEventListener('blur', function(){ canvasFocused = false; });
    canvas.addEventListener('keydown', function(e){
      if(gameOver || projectile || dragging) return;
      if(e.key==='ArrowUp'){ keyAim.power = Math.min(100, keyAim.power+5); }
      else if(e.key==='ArrowDown'){ keyAim.power = Math.max(10, keyAim.power-5); }
      else if(e.key==='ArrowLeft'){ keyAim.angle = Math.min(80, keyAim.angle+3); }
      else if(e.key==='ArrowRight'){ keyAim.angle = Math.max(15, keyAim.angle-3); }
      else if(e.key===' ' || e.key==='Enter' || e.key==='Spacebar'){
        var kp = keyAimPoint(); e.preventDefault(); fireStone(kp.x, kp.y); return;
      } else { return; }
      e.preventDefault();
      powerEl.textContent = s.powerLabel + keyAim.power + '%';
    });

    function endGame(hitStoneNumber, hit){
      gameOver = true;
      lastDuelResult = hitStoneNumber;
      if(hit){
        var best = localStorage.getItem(BEST_KEY_DAVID);
        if(!best || hitStoneNumber < parseInt(best,10)) localStorage.setItem(BEST_KEY_DAVID, String(hitStoneNumber));
      }
      choiceRecord('duel', function(strs){
        if(hit && hitStoneNumber<=1) return strs.journeyOne;
        if(hit) return strs.journeyMultiPrefix + hitStoneNumber + strs.journeyMultiSuffix;
        return strs.journeyExhausted;
      });
      msgEl.textContent = hit ? s.hitMsg : s.exhaustedMsg;
      nextRow.hidden = false;
      el.querySelector('#duel-next-btn').focus();
    }

    function tick(now){
      var tm = now - t0;
      if(projectile){
        projectile.x += projectile.vx;
        projectile.y += projectile.vy;
        projectile.vy += GRAVITY;
        var target = goliathTarget;
        if(target){
          var dxh = projectile.x-target.x, dyh = projectile.y-target.y;
          if(Math.sqrt(dxh*dxh+dyh*dyh) < target.forehead+5){
            goliathHitFlash = 14; projectile = null; endGame(stonesUsed, true);
          } else if(projectile && target.body &&
                    projectile.x>target.body.x && projectile.x<target.body.x+target.body.w &&
                    projectile.y>target.body.y && projectile.y<target.body.y+target.body.h){
            goliathHitFlash = 8; projectile = null;
            if(stonesUsed>=stonesTotal){ endGame(stonesTotal, false); }
            else { msgEl.textContent = s.glanceMsg; powerEl.textContent = s.dragHint; }
          } else if(projectile.y>CH || projectile.x>CW || projectile.x<0){
            projectile = null;
            if(stonesUsed>=stonesTotal){ endGame(stonesTotal, false); }
            else { msgEl.textContent = s.missMsg; powerEl.textContent = s.dragHint; }
          }
        }
      }
      if(!gameOver){ drawScene(tm); gameRafId = requestAnimationFrame(tick); }
    }
    gameRafId = requestAnimationFrame(tick);
  }

  /* ---------- Red Sea minigame (Moses) ---------- */
  function renderRedSea(el){
    var s = t().mRedsea;
    el.innerHTML =
      '<div class="icon-row">'+icon('wave')+'<p class="eyebrow">'+s.eyebrow+'</p></div>' +
      '<h2>'+s.h2+'</h2>' +
      '<p>'+s.p1+'</p>' +
      '<div class="game-wrap">' +
        '<canvas id="redsea-canvas" class="game-canvas-el" width="1000" height="340" tabindex="0" aria-label="'+s.ariaLabel+'"></canvas>' +
      '</div>' +
      '<div class="game-hud"><div class="meter-track"><div class="meter-fill" id="redsea-meter"></div></div><div id="redsea-readout" class="mono">'+s.holdHint+'</div></div>' +
      '<p class="reveal-msg" id="redsea-msg">'+s.initialMsg+'</p>' +
      '<div class="cta-row" id="redsea-next-row" hidden><button class="btn primary" id="redsea-next-btn">'+t().nextLabel+'</button></div>';

    el.querySelector('#redsea-next-btn').addEventListener('click', function(){ go(6); });

    var canvas = el.querySelector('#redsea-canvas');
    var ctx = canvas.getContext('2d');
    var meterFill = el.querySelector('#redsea-meter');
    var readout = el.querySelector('#redsea-readout');
    var msgEl = el.querySelector('#redsea-msg');
    var nextRow = el.querySelector('#redsea-next-row');

    var CW, CH;
    function fitCanvas(){
      var rect = canvas.getBoundingClientRect();
      CW = canvas.width = rect.width * 2;
      CH = canvas.height = rect.height * 2;
      ctx.setTransform(2,0,0,2,0,0);
      CW = rect.width; CH = rect.height;
    }
    fitCanvas();
    gameResizeHandler = function(){ fitCanvas(); };
    window.addEventListener('resize', gameResizeHandler);

    var HOLD_RATE = 100/9000;   // % per ms held
    var DECAY_RATE = 100/3200;  // % per ms released (drains faster than it fills)
    var progress = 0, holding = false, gameOver = false, closeCalls = 0;
    var wasBelowThreshold = false;
    var chariotStart = performance.now();
    var canvasFocused = false;
    var t0 = performance.now();
    var lastTm = 0;
    var msgCooldown = 0;

    function setHolding(v){
      if(gameOver) return;
      holding = v;
      readout.textContent = holding ? s.holding : s.released;
    }

    canvas.addEventListener('pointerdown', function(e){ e.preventDefault(); canvas.setPointerCapture(e.pointerId); setHolding(true); });
    canvas.addEventListener('pointerup', function(){ setHolding(false); });
    canvas.addEventListener('pointercancel', function(){ setHolding(false); });
    canvas.addEventListener('lostpointercapture', function(){ setHolding(false); });
    canvas.addEventListener('focus', function(){ canvasFocused = true; });
    canvas.addEventListener('blur', function(){ canvasFocused = false; setHolding(false); });
    canvas.addEventListener('keydown', function(e){
      if(e.key===' ' || e.key==='Enter' || e.key==='Spacebar'){ e.preventDefault(); setHolding(true); }
    });
    canvas.addEventListener('keyup', function(e){
      if(e.key===' ' || e.key==='Enter' || e.key==='Spacebar'){ e.preventDefault(); setHolding(false); }
    });

    function drawScene(tm, dt){
      ctx.clearRect(0,0,CW,CH);
      var g = ctx.createLinearGradient(0,0,0,CH);
      g.addColorStop(0,'#141a30'); g.addColorStop(1,'#1c2340');
      ctx.fillStyle = g; ctx.fillRect(0,0,CW,CH);

      var pathW = CW*0.42;
      var pathL = CW*0.5 - pathW/2, pathR = CW*0.5 + pathW/2;
      var shudder = holding ? 0 : Math.min(10, (100-progress)*0.06);
      var jitter = PREFERS_REDUCED_MOTION ? 0 : Math.sin(tm*0.02)*shudder;

      ctx.fillStyle = '#1f3a52';
      ctx.fillRect(0, 0, pathL - jitter, CH);
      ctx.fillRect(pathR + jitter, 0, CW - (pathR+jitter), CH);
      ctx.strokeStyle = 'rgba(120,190,220,.35)'; ctx.lineWidth = 2;
      for(var w=0; w<5; w++){
        ctx.beginPath();
        for(var x=0; x<pathL; x+=8){ var yy = 20 + w*60 + Math.sin((x+tm*0.05)*0.05)*6; if(x===0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy); }
        ctx.stroke();
        ctx.beginPath();
        for(var x2=pathR+jitter; x2<CW; x2+=8){ var yy2 = 20 + w*60 + Math.sin((x2+tm*0.05)*0.05)*6; if(x2===pathR+jitter) ctx.moveTo(x2,yy2); else ctx.lineTo(x2,yy2); }
        ctx.stroke();
      }

      ctx.fillStyle = '#2a2416';
      ctx.fillRect(pathL - jitter, 0, (pathR+jitter)-(pathL-jitter), CH);

      var travel = Math.min(1, progress/100);
      var peopleN = 6;
      for(var i=0;i<peopleN;i++){
        var px = pathL + 10 + (pathR-pathL-20) * Math.max(0, Math.min(1, travel*1.3 - i*0.09));
        var py = CH*0.35 + (i%3)*22 + 6;
        ctx.fillStyle = 'rgba(233,223,196,.8)';
        ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI*2); ctx.fill();
      }

      var chariotElapsed = tm;
      var chariotX = pathL - 60 + Math.min(pathL+40, chariotElapsed*0.012);
      ctx.fillStyle = 'rgba(164,67,47,.85)';
      ctx.fillRect(Math.max(-40,chariotX-16), CH-40, 30, 14);
      ctx.beginPath(); ctx.arc(Math.max(-40,chariotX-1), CH-26, 6, 0, Math.PI*2); ctx.fill();

      var moseX = pathL - 22, moseY = CH-30;
      ctx.strokeStyle = '#caa257'; ctx.lineWidth = 3; ctx.lineCap='round';
      var armLift = holding ? -34 : -34 + Math.min(20, (100-progress)*0.1);
      ctx.beginPath(); ctx.moveTo(moseX, moseY); ctx.lineTo(moseX, moseY-30); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(moseX, moseY-24); ctx.lineTo(moseX+10, moseY+armLift); ctx.stroke();
      ctx.fillStyle = '#f0c877'; ctx.beginPath(); ctx.arc(moseX, moseY-34, 6, 0, Math.PI*2); ctx.fill();

      meterFill.style.width = Math.round(progress) + '%';
    }

    function tick(now){
      var dt = now - lastTm; if(!lastTm) dt = 16; lastTm = now;
      var tm = now - t0;
      if(!gameOver){
        var below = progress < 25;
        if(holding){
          progress = Math.min(100, progress + HOLD_RATE*dt);
        } else {
          progress = Math.max(0, progress - DECAY_RATE*dt);
        }
        if(below && progress > 40 && wasBelowThreshold){
          closeCalls += 1;
          msgEl.textContent = s.closeCallMsg;
          wasBelowThreshold = false;
        }
        if(progress < 20) wasBelowThreshold = true;
        if(!holding && progress > 0 && progress < 60 && msgCooldown<=0){
          msgEl.textContent = s.wobbleMsg;
          msgCooldown = 900;
        }
        if(msgCooldown>0) msgCooldown -= dt;

        if(progress >= 100){
          gameOver = true;
          var best = localStorage.getItem(BEST_KEY_MOSES);
          if(best===null || closeCalls < parseInt(best,10)) localStorage.setItem(BEST_KEY_MOSES, String(closeCalls));
          choiceRecord('mRedsea', function(strs){
            return closeCalls===0 ? strs.journeyClean : (strs.journeyCloseCallsPrefix + closeCalls + strs.journeyCloseCallsSuffix);
          });
          msgEl.textContent = s.successMsg;
          readout.textContent = '';
          nextRow.hidden = false;
          el.querySelector('#redsea-next-btn').focus();
        }
      }
      drawScene(tm, dt);
      if(!gameOver){ gameRafId = requestAnimationFrame(tick); }
    }
    gameRafId = requestAnimationFrame(tick);
  }

  function renderEnd(el, key){
    var s = t()[key];
    var list = journey.map(function(j){
      var sceneStrs = t()[j.sceneKey];
      return '<li><span class="tag">'+sceneStrs.tag+'</span>'+j.resolver(sceneStrs)+'</li>';
    }).join('');
    el.innerHTML =
      '<div class="icon-row">'+icon('crown')+'<p class="eyebrow">'+s.eyebrow+'</p></div>' +
      '<h2>'+s.h2+'</h2>' +
      '<p>'+s.p1+'</p>' +
      '<p class="verse">'+s.verse+'<br>'+s.verseRef+'</p>' +
      '<p>'+s.p2+'</p>' +
      '<h3 style="font-size:15px; color:var(--bronze); margin:28px 0 4px; text-transform:uppercase; letter-spacing:.1em;">'+s.journeyHeading+'</h3>' +
      '<ul class="journey">' + list + '</ul>' +
      '<div class="cta-row">' +
        '<button class="btn primary" id="again-btn">'+s.again+'</button>' +
        '<button class="btn secondary" id="other-btn">'+s.chooseOther+'</button>' +
      '</div>';
    el.querySelector('#again-btn').addEventListener('click', function(){
      journey = [];
      lastDuelResult = null;
      go(0);
    });
    el.querySelector('#other-btn').addEventListener('click', backToSelect);
  }

  applyChrome();
  render('select');
})();
</script>
